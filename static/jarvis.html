<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>贾维斯</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#05080f; overflow:hidden;
              font-family:"Microsoft YaHei",sans-serif; color:#cfd8e3; user-select:none; }
  #orb { position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); }

  #statusBox { position:absolute; top:26px; left:30px; display:flex; align-items:center; gap:12px; }
  #statusBox .title { font-size:22px; font-weight:bold; color:#e8f0ff; letter-spacing:2px; }
  #statusBox .sub   { font-size:12px; color:#7f8ea3; margin-top:2px; }
  #dot { width:9px; height:9px; border-radius:50%; background:#39d98a; box-shadow:0 0 8px #39d98a;
         animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  #avatar { position:absolute; right:36px; top:18px;
            width:88px; height:88px; border-radius:50%;
            border:2px solid rgba(80,160,255,.55); box-shadow:0 0 22px rgba(60,140,255,.35);
            background:radial-gradient(circle at 35% 30%, #3b6ea5, #0b1a2e);
            display:flex; align-items:center; justify-content:center;
            font-size:30px; color:#9fc6ff; }

  #chatLog { position:absolute; top:130px; right:24px; bottom:130px; width:300px;
             display:flex; flex-direction:column; gap:10px; overflow-y:auto;
             padding:6px 4px; z-index:5;
             scrollbar-width:thin; scrollbar-color:rgba(80,140,220,.35) transparent; }
  #chatLog::-webkit-scrollbar { width:5px; }
  #chatLog::-webkit-scrollbar-thumb { background:rgba(80,140,220,.35); border-radius:3px; }
  #chatEmpty { color:#5d6b7d; font-size:12px; text-align:center; margin:auto; line-height:1.8; }
  .msg { max-width:100%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.7;
         white-space:pre-wrap; word-break:break-word; user-select:text;
         animation:msgIn .25s ease; }
  .msg.me { align-self:flex-end; background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#eaf2ff;
            border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:rgba(16,28,48,.92); border:1px solid rgba(80,160,255,.3);
            color:#dceaff; border-bottom-left-radius:4px; }
  @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  #bubble { position:absolute; left:50%; bottom:24%; transform:translateX(-50%);
            max-width:62%; background:rgba(16,28,48,.92); border:1px solid rgba(80,160,255,.35);
            color:#dceaff; padding:12px 18px; border-radius:14px; font-size:14px; line-height:1.7;
            display:none; box-shadow:0 0 24px rgba(40,120,255,.25); }

  #bar { position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
         width:56%; display:flex; gap:10px; }
  #inp { flex:1; background:rgba(18,30,52,.85); border:1px solid rgba(80,140,220,.4);
         border-radius:24px; padding:12px 20px; color:#e6eefb; font-size:14px; outline:none; }
  #inp:focus { border-color:#4d9aff; box-shadow:0 0 12px rgba(70,150,255,.35); }
  .btn { border:none; border-radius:24px; padding:12px 22px; font-size:14px; cursor:pointer;
         color:#fff; background:linear-gradient(135deg,#2563eb,#4d9aff); }
  .btn:active { transform:scale(.96); }
  #micBtn.rec { background:linear-gradient(135deg,#dc2626,#f87171); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 18px rgba(239,68,68,.8); } }

/* ============ 人设商店渲染逻辑 ============ */
const PERSONAS = {};
let currentPersona = 'jarvis';

function loadPersonaStore() {
  fetch('/api/personas').then(r=>r.json()).then(list=>{
    list.forEach(p=>{ PERSONAS[p.id] = p; });
    Object.entries(BUILTIN_PERSONAS).forEach(([k,v])=>{ if(!PERSONAS[k]) PERSONAS[k]=v; });
    renderPersonaStore();
  }).catch(()=>{
    Object.assign(PERSONAS, BUILTIN_PERSONAS);
    renderPersonaStore();
  });
}

function renderPersonaStore() {
  const html = Object.entries(PERSONAS).map(([id,p])=>`
    <div class="persona-card" data-role="${p.id}" style="
      background:#112240;border:1px solid #1e3a5f;border-radius:10px;
      padding:14px;margin:10px 0;cursor:pointer;
      ${currentPersona===p.id?'border-color:#4d9aff;box-shadow:0 0 12px rgba(70,150,255,.4);':''}
    ">
      <div style="font-weight:bold;color:#e8f0ff">${p.name}</div>
      <div style="color:#7f8ea3;font-size:12px;margin-top:4px">${p.desc}</div>
      ${currentPersona===p.id?'<div style="position:absolute;top:8px;right:10px;color:#4d9aff">✓ 当前</div>':''}
    </div>`).join('');
  document.getElementById('personaList').innerHTML = html;
  document.querySelectorAll('.persona-card').forEach(c=>c.onclick=()=>switchPersona(c.dataset.role));
}

async function switchPersona(role) {
  const r = await fetch('/api/persona',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});
  if((await r.json()).ok){
    currentPersona = role;
    renderPersonaStore();
    alert('已切换至 '+PERSONAS[role].name+'，新对话生效');
  }
}

/* 侧边栏开关 */
document.getElementById('personaBtn').onclick = () => {
  document.getElementById('personaPanel').style.left = '0';
  loadPersonaStore();
};
document.getElementById('closePersona').onclick = () => document.getElementById('personaPanel').style.left = '-340px';

loadPersonaStore();

/* ================ 粒子球画布 ================ */
const cv = document.getElementById('orb');
const ctx = cv.getContext('2d');

function fit() { cv.width = innerWidth; cv.height = innerHeight;
                 cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px'; }
fit(); addEventListener('resize', fit);

// ── 配色在这里改: [核心亮色, 外围色, 光晕色] ──
const THEME = {
  inner: 'rgba(190,225,255,',   // 近处粒子
  outer: 'rgba(70,130,220,',    // 远处粒子
  glow:  'rgba(60,140,255,'     // 中心光晕
};

const N = 750, pts = [];
for (let i = 0; i < N; i++) {
  const th = Math.acos(2*Math.random()-1), ph = Math.random()*Math.PI*2;
  pts.push({ th, ph, r: .78 + Math.random()*.22, sp: .4 + Math.random()*.9, tw: Math.random()*6.28 });
}
let t = 0;
function draw() {
  t += .016;
  ctx.clearRect(0,0,cv.width,cv.height);
  const cx = cv.width/2, cy = cv.height/2;
  const R = Math.min(cv.width, cv.height) * .3;

  // 中心呼吸光晕
  const breath = .5 + .5*Math.sin(t*1.2);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*1.5);
  g.addColorStop(0, THEME.glow + (0.10 + breath*0.08) + ')');
  g.addColorStop(0.55, THEME.glow + '0.04)');
  g.addColorStop(1, THEME.glow + '0)');
  ctx.fillStyle = g;
  ctx.fillRect(cx-R*1.6, cy-R*1.6, R*3.2, R*3.2);

  const speed = STATE==='listen' ? 2.2 : STATE==='speak' ? 1.6 : STATE==='think' ? 1.2 : .7;
  const glow  = STATE==='idle' ? .6 : 1;
  for (const p of pts) {
    p.ph += .002 * p.sp * speed;
    const x3 = Math.sin(p.th)*Math.cos(p.ph)*p.r;
    const y3 = Math.cos(p.th)*p.r;
    const z3 = Math.sin(p.th)*Math.sin(p.ph)*p.r;
    const rot = t * .25 * speed;
    const x = x3*Math.cos(rot) - z3*Math.sin(rot);
    const z = x3*Math.sin(rot) + z3*Math.cos(rot);
    const per = 1/(1.6 - z*.45);
    const px = cx + x*R*per, py = cy + y3*R*per;
    const pulse = STATE==='speak' ? .5+.5*Math.sin(t*10+p.tw) : .75+.25*Math.sin(t*2+p.tw);
    const a = (z>0? .95:.4) * pulse * glow;
    const size = (z>0? 2.3:1.4) * per * (STATE==='speak'? 1.3:1);
    ctx.beginPath();
    ctx.arc(px, py, size, 0, 6.283);
    ctx.fillStyle = (z>0 ? THEME.inner : THEME.outer) + a + ')';
    ctx.shadowColor = THEME.glow + '.9)';
    ctx.shadowBlur = 10 * pulse * glow;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(draw);
}
draw();

/* ================== 中间气泡(提示用, 对话正文走右栏) ================== */
const bubble = document.getElementById('bubble');
let bubbleTimer;
function showBubble(text, ms=8000) {
  bubble.textContent = text; bubble.style.display = 'block';
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=> bubble.style.display='none', ms);
}

/* ================== 右侧聊天记录栏 ================== */
const chatLog = document.getElementById('chatLog');
const aiName = () => (typeof PERSONAS !== 'undefined' && PERSONAS[currentPersona])
                     ? PERSONAS[currentPersona].name : 'AI';
function addMsg(who, text) {
  const empty = document.getElementById('chatEmpty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'user' ? 'me' : 'ai');
  d.textContent = (who === 'user' ? '我' : aiName()) + '：' + text;
  chatLog.appendChild(d);
  while (chatLog.children.length > 80) chatLog.removeChild(chatLog.firstChild);  // 防止无限膨胀
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function ask(text) {
  addMsg('user', text);
  setStatus('think', '思考中…');
  try {
    const r = await fetch('/api/chat', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, role:currentPersona }) });
    let d = await r.json();
    if (d.async && d.task_id) {
      for (let i=0;i<300;i++) {
        await new Promise(res=>setTimeout(res,500));
        const t = await (await fetch('/api/task_status?task_id='+d.task_id)).json();
        if (t.status==='done'||t.status==='error') { d = t; break; }
      }
    }
    const reply = d.reply || '（出错了）';
    addMsg('ai', reply);
    setStatus('speak', '正在回答');
    await speak(reply);
    keepAwake();  // 回复成功后续期免唤醒, 保证连续对话不中断
    if (continuous) {
      setStatus('idle', '继续说吧…');
      setTimeout(startRec, 600);          // 自动回到聆听, 持续对话
    } else {
      setStatus('idle', '已连接，点击麦克风继续');
    }
  } catch(e) {
    setStatus('idle', '连接失败：'+e.message);
  }
}

async function speak(text) {
  try {
    const r = await fetch('/api/tts', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, role:currentPersona }) });
    const buf = await r.arrayBuffer();
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const audio = await ac.decodeAudioData(buf);
    const src = ac.createBufferSource();
    src.buffer = audio;
    src.connect(ac.destination);
    src.start();
    await new Promise(res => { src.onended = res; });
    ac.close();
  } catch(e) { console.warn('tts', e); }
}

/* ================== 文字输入 ================== */
const inp = document.getElementById('inp');
function sendText() {
  const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  ask(v);
}
document.getElementById('sendBtn').onclick = sendText;
inp.addEventListener('keydown', e => { if (e.key==='Enter') sendText(); });

/* ================== 唤醒词过滤 ================== */
const WAKE_WORDS = ['贾维斯同学', '贾维斯', 'jarvis', '贾哥', '加维斯', '加威斯', '加欸石碰', '嗨', '嘿'];
let woken = false;           // 是否处于免唤醒期
let wakeTimer = null;        // 免唤醒倒计时
const WAKE_HOLD_MS = 300000; // 唤醒保持 5 分钟（每次说话自动续期, 连续对话）

function resetWake() {
  woken = false;
  if (wakeTimer) { clearTimeout(wakeTimer); wakeTimer = null; }
}

function keepAwake() {
  woken = true;
  if (wakeTimer) clearTimeout(wakeTimer);
  wakeTimer = setTimeout(resetWake, WAKE_HOLD_MS);
}

function extractCommand(text) {
  const t = (text || '').trim();
  const lower = t.toLowerCase();
  for (const w of WAKE_WORDS) {
    const idx = lower.indexOf(w.toLowerCase());
    if (idx >= 0) {
      const rest = t.slice(idx + w.length).replace(/^[，,。.!！?？:：\s]+/, '').trim();
      keepAwake();
      return rest || '__WOKE__';
    }
  }
  // 睡眠词：主动结束免唤醒
  if (/^(睡吧|休息|拜拜|再见|退下|闭嘴)$/.test(t)) {
    resetWake();
    return '__SLEEP__';
  }
  return '';
}

/* ================== 语音输入: 自动断句 + 连续对话 ================== */
let mediaStream=null, audioCtx=null, processor=null, chunks=[], recStart=0;
let spoke = false, silenceMs = 0;
let continuous = true;              // 连续对话开关
const micBtn = document.getElementById('micBtn');

// 连续对话开关按钮
const contBtn = document.createElement('button');
contBtn.className = 'btn';
contBtn.style.background = 'linear-gradient(135deg,#0e7490,#22d3ee)';
contBtn.textContent = '连续对话:开';
document.getElementById('bar').appendChild(contBtn);
contBtn.onclick = () => {
  continuous = !continuous;
  contBtn.textContent = '连续对话:' + (continuous ? '开' : '关');
  if (!continuous && mediaStream && mediaStream.active) stopRec();
};

function encodeWAV(f32, sr) {
  const ratio = Math.max(1, Math.round(sr/16000));
  const n = Math.floor(f32.length/ratio), out = new Float32Array(n);
  for (let i=0;i<n;i++) out[i] = f32[i*ratio];
  const buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const ws = (o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); v.setUint32(4,36+n*2,true); ws(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*2,true);
  for (let i=0;i<n;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,out[i]))*32767, true);
  return new Blob([buf], {type:'audio/wav'});
}

async function startRec() {
  mediaStream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = audioCtx;                       // 局部引用, 避免 stopRec 置空后读 null
  const src = ctx.createMediaStreamSource(mediaStream);
  chunks = []; recStart = Date.now();
  spoke = false; silenceMs = 0;

  const handleChunk = data => {
    if (ctx.state === 'closed') return;
    chunks.push(new Float32Array(data));
    const sec = (Date.now()-recStart)/1000;
    // 音量检测: 说过话后静音 1.2 秒自动断句
    let sum = 0;
    for (let i=0;i<data.length;i++) sum += data[i]*data[i];
    const rms = Math.sqrt(sum/data.length);
    if (rms > 0.02) { spoke = true; silenceMs = 0; }
    else if (spoke) {
      silenceMs += (data.length/ctx.sampleRate)*1000;
      if (silenceMs > 1200) { stopRec(); return; }
    }
    setStatus('listen', `正在聆听… ${sec.toFixed(0)}秒` + (spoke ? ' (说完自动发送)' : ''));
    if (sec >= 60) stopRec();
  };

  // AudioWorklet 优先(内联 Blob, 替代已废弃的 ScriptProcessorNode)。
  // 部分 Edge 版本对 Blob URL worklet 会抛 AbortError: Unable to load a worklet's module,
  // 所以失败时回退 ScriptProcessorNode, 保证录音在任何内核上都可用。
  let viaWorklet = true;
  try {
    const workletBlob = new Blob([`
      class RecProcessor extends AudioWorkletProcessor {
        process(inputs) {
          const input = inputs[0];
          if (input && input[0]) {
            this.port.postMessage(input[0].slice(0));
          }
          return true;
        }
      }
      registerProcessor('rec-processor', RecProcessor);
    `], {type: 'application/javascript'});
    const workletUrl = URL.createObjectURL(workletBlob);
    await ctx.audioWorklet.addModule(workletUrl);
    URL.revokeObjectURL(workletUrl);
    processor = new AudioWorkletNode(ctx, 'rec-processor', {numberOfInputs:1, numberOfOutputs:0});
    processor.port.onmessage = e => handleChunk(e.data);
    src.connect(processor);   // 无输出节点, 不连 destination(避免回声)
  } catch (e) {
    viaWorklet = false;
    processor = ctx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = ev => handleChunk(ev.inputBuffer.getChannelData(0));
    src.connect(processor);
    processor.connect(ctx.destination);  // ScriptProcessor 必须连到输出端才会泵数据
  }
  micBtn.classList.add('rec'); micBtn.textContent = '⏹ 结束';
  setStatus('listen', '正在聆听… (说完停顿1秒自动发送)');
}

function b64FromBytes(bytes) {
  let bin = '';
  const CH = 0x8000;   // 分块转换, 大音频一次性展开会撑爆调用栈
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}

async function stopRec() {
  try {
    micBtn.classList.remove('rec'); micBtn.textContent = '🎤 说话';
    if (processor) { try{ if(processor.onaudioprocess) processor.onaudioprocess = null; }catch(e){} try{ if(processor.port){processor.port.onmessage=null;processor.port.close();} }catch(e){} try{processor.disconnect();}catch(e){} }
    if (mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
    const sr = audioCtx ? audioCtx.sampleRate : 48000;
    if (audioCtx) { try{audioCtx.close();}catch(e){} audioCtx = null; }
    const merged = new Float32Array(chunks.reduce((a,c)=>a+c.length,0));
    let off=0; for (const c of chunks){ merged.set(c,off); off+=c.length; }
    chunks = [];
    const dur = merged.length/sr;
    if (dur < 0.6) {
      setStatus('idle','太短了，再说一次');
      if (continuous) setTimeout(startRec, 800);
      return;
    }
    setStatus('think', '识别中…');
    const bytes = new Uint8Array(await encodeWAV(merged,sr).arrayBuffer());
    const b64 = b64FromBytes(bytes);
    const r = await fetch('/api/stt',{method:'POST',headers:{'Content-Type':'application/json'},
                                      body:JSON.stringify({audio:b64})});
    const d = await r.json();
    const text = (d.text||'').trim();
    if (!text || text.startsWith('（')) {
      setStatus('idle', text||'没听清，再试一次');
      if (continuous) setTimeout(startRec, 1000);
      return;
    }
    // 唤醒词过滤
    const cmd = extractCommand(text);
    if (cmd === '__SLEEP__') {
      showBubble('贾维斯：好的先生，我先歇会儿。', 3000);
      speak('好的先生，我先歇会儿。');
      setStatus('idle', '已进入休眠，喊我随时唤醒');
      if (continuous) setTimeout(startRec, 1000);
      return;
    }
    if (!cmd) {
      if (woken) {
        // 免唤醒期内：直接当指令
        ask(text);
        return;
      }
      showBubble('（没听到唤醒词，说"贾维斯同学 xxx"来唤醒我）', 3000);
      setStatus('idle', '说"贾维斯同学 xxx"来唤醒我');
      if (continuous) setTimeout(startRec, 1000);
      return;
    }
    if (cmd === '__WOKE__') {
      // 只喊了唤醒词 -> 本地应答继续听, 不发给 LLM
      showBubble('贾维斯：在，先生。请讲～', 3500);
      speak('在，先生。请讲。');
      setStatus('idle', '在，先生。请讲～（可以直接说指令）');
      if (continuous) setTimeout(startRec, 600);
      return;
    }
    keepAwake();  // 成功指令后刷新免唤醒计时
    ask(cmd);
  } catch(e) {
    setStatus('idle', '出错: ' + e.message);
    if (continuous) setTimeout(startRec, 1500);
  }
}

micBtn.onclick = () => {
  if (mediaStream && mediaStream.active) stopRec();
  else startRec().catch(e=>setStatus('idle','麦克风不可用:'+e.message));
};

/* 开场 */
setTimeout(()=> setStatus('idle','已连接，正在聆听'), 800);
</script>
